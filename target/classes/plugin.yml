name: BotSentinel
version: 2.2.0
main: cn.botsentinel.BotSentinelPlugin
api-version: '1.21'
folia-supported: true
description: 无感风控反机器人 - 进服前拦截 + 特征库自更新 + 封禁规避防御 + IP归属地拦截
author: BotSentinel
website: https://github.com/Gsjsjzhznsz/BotSentinel

commands:
  atb:
    description: BotSentinel 风控管理命令
    usage: /atb help
    permission: botsentinel.admin

permissions:
  botsentinel.admin:
    description: BotSentinel 管理权限
    default: op
  botsentinel.alert:
    description: 接收 BotSentinel 警报
    default: op
