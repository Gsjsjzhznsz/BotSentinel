# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# BotSentinel 版本 (Release 用)
mod_version=2.4.0

# Fabric Properties (https://fabricmc.net/develop)
# CI 会按目标 MC 版本动态覆写 minecraft_version/yarn_mappings/fabric_version
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.17.2

# Fabric API
fabric_version=0.119.4+1.21.4

# loom 版本 (Gradle 8.x 用 1.9.x; 26.x/Java25 构建时 CI 覆写)
loom_version=1.9.2

# 字节码目标版本 (1.20.1~1.20.4=17, 1.20.5+=21, 26.x=25)
java_release=21
