name: Build BotSentinel (Forge)

# forge 分支自验证构建: push 到 forge 分支时用 gradle.properties 里的默认版本编译。
# 全版本(1.20.1→26.2)矩阵构建与 Release 发布统一由 main 分支的 build.yml 负责。

on:
  push:
    branches: [ forge ]
  pull_request:
    branches: [ forge ]
  workflow_dispatch:
    inputs:
      mc_version:
        description: '目标 MC 版本(留空=gradle.properties 默认)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.10.2 (ForgeGradle 6 兼容)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Override MC version (手动触发可选)
        if: ${{ github.event.inputs.mc_version != '' }}
        run: |
          V="${{ github.event.inputs.mc_version }}"
          FORGE=$(curl -sfL "https://files.minecraftforge.net/maven/net/minecraftforge/forge/promotions_slim.json" | jq -r ".promos[\"$V-latest\"] // empty")
          [ -z "$FORGE" ] && { echo "官方无该版本 Forge 构建: $V"; exit 1; }
          sed -i "s/^minecraft_version=.*/minecraft_version=$V/" gradle.properties
          sed -i "s/^forge_version=.*/forge_version=$FORGE/" gradle.properties
          MAJ=$(echo "$V" | cut -d. -f1); MIN=$(echo "$V" | cut -d. -f2); PAT=$(echo "$V" | cut -d. -f3)
          NUM=$((MAJ*10000 + MIN*100 + ${PAT:-0}))
          if [ "$NUM" -lt 10202 ]; then J=17; else J=21; fi
          sed -i "s/^java_release=.*/java_release=$J/" gradle.properties
          echo "构建 MC $V / Forge $FORGE / Java $J"

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: BotSentinel-forge
          path: build/libs/*.jar
          if-no-files-found: error
